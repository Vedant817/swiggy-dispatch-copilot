services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch}
      POSTGRES_DB: dispatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://dispatch:${POSTGRES_PASSWORD:-dispatch}@postgres:5432/dispatch?sslmode=disable
      REDIS_ADDR: redis:6379
      CONFIG_PATH: /app/configs/default.yaml
      APP_ENV: ${APP_ENV:-local}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./configs:/app/configs:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://dispatch:${POSTGRES_PASSWORD:-dispatch}@postgres:5432/dispatch?sslmode=disable
      REDIS_ADDR: redis:6379
      CONFIG_PATH: /app/configs/default.yaml
      APP_ENV: ${APP_ENV:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./configs:/app/configs:ro

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    profiles: ["agent"]
    working_dir: /app
    command: ["python", "-m", "app.main", "--help"]
    environment:
      AGENT_BASE_URL: http://api:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
